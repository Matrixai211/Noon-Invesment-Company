<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Noon Operations Dashboard</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin-shell"><aside class="sidebar"><div class="brand"><span>ن</span><div><strong>NOON</strong><small>OPERATIONS</small></div></div><nav><button data-filter="all" class="active">All Leads</button><button data-filter="inquiry">Inquiries</button><button data-filter="partner">Partners</button><button data-filter="investor">Investors</button><button data-filter="supplier">Suppliers</button><button data-filter="career">Careers</button></nav><button id="logout" class="logout">Lock Dashboard</button></aside><section class="workspace"><header><div><p>INTERNAL CRM</p><h1>Lead & Partnership Pipeline</h1></div><button id="refresh">Refresh</button></header><section id="loginPanel" class="login-panel"><h2>Secure access</h2><p>Enter the admin access key configured in Vercel. The key is kept only in this browser session.</p><form id="loginForm"><input id="adminKey" type="password" autocomplete="current-password" placeholder="Admin access key" required><button>Unlock dashboard</button></form><p id="loginMsg" class="msg"></p></section><section id="dashboard" hidden><div class="metrics"><article><span>Total</span><strong id="mTotal">0</strong></article><article><span>New</span><strong id="mNew">0</strong></article><article><span>Qualified</span><strong id="mQualified">0</strong></article><article><span>Partners + Investors</span><strong id="mStrategic">0</strong></article></div><div class="toolbar"><input id="search" placeholder="Search name, company, email, country"><select id="statusFilter"><option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="closed">Closed</option><option value="rejected">Rejected</option></select></div><div class="table-wrap"><table><thead><tr><th>Type</th><th>Lead</th><th>Company</th><th>Country</th><th>Status</th><th>Received</th><th>Action</th></tr></thead><tbody id="leadRows"></tbody></table></div><p id="empty" class="empty" hidden>No leads match the current view.</p></section></section></main><dialog id="leadDialog"><form method="dialog"><button class="close">×</button></form><div id="leadDetail"></div></dialog><script src="admin.js"></script></body></html>
